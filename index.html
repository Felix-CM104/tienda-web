<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TecnoShop · Tienda online</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="cabecera">
    <h1 class="logo">Tecno<span>Shop</span></h1>
    <button id="btn-carrito" class="btn-carrito" aria-label="Abrir carrito">
      🛒 <span id="contador-carrito" class="contador">0</span>
    </button>
  </header>

  <main class="contenedor">
    <section class="filtros">
      <input id="buscador" type="search" placeholder="Buscar productos..." aria-label="Buscar productos">
      <select id="filtro-categoria" aria-label="Filtrar por categoría">
        <option value="todas">Todas las categorías</option>
      </select>
      <select id="orden" aria-label="Ordenar">
        <option value="relevancia">Relevancia</option>
        <option value="precio-asc">Precio: menor a mayor</option>
        <option value="precio-desc">Precio: mayor a menor</option>
        <option value="nombre">Nombre (A-Z)</option>
      </select>
    </section>

    <p id="sin-resultados" class="sin-resultados" hidden>No se han encontrado productos.</p>
    <section id="catalogo" class="catalogo" aria-live="polite"></section>
  </main>

  <!-- Panel lateral del carrito -->
  <aside id="panel-carrito" class="panel-carrito" aria-hidden="true">
    <div class="panel-cabecera">
      <h2>Tu carrito</h2>
      <button id="cerrar-carrito" class="btn-icono" aria-label="Cerrar carrito">✕</button>
    </div>
    <ul id="lista-carrito" class="lista-carrito"></ul>
    <p id="carrito-vacio" class="carrito-vacio">El carrito está vacío.</p>
    <div class="resumen">
      <p>Subtotal <span id="subtotal">0,00 €</span></p>
      <p>IVA (21%) <span id="iva">0,00 €</span></p>
      <p>Envío <span id="envio">0,00 €</span></p>
      <p class="total">Total <span id="total">0,00 €</span></p>
      <small>Envío gratis a partir de 50 €</small>
      <button id="btn-pagar" class="btn-principal" disabled>Finalizar compra</button>
      <button id="btn-vaciar" class="btn-secundario">Vaciar carrito</button>
    </div>
  </aside>
  <div id="fondo" class="fondo" hidden></div>

  <!-- Formulario de pedido -->
  <dialog id="dialogo-pedido" class="dialogo">
    <form id="form-pedido" novalidate>
      <h2>Datos de envío</h2>
      <label>Nombre completo
        <input name="nombre" required minlength="3">
      </label>
      <label>Email
        <input name="email" type="email" required>
      </label>
      <label>Teléfono
        <input name="telefono" required pattern="[6-9][0-9]{8}" placeholder="600123123">
      </label>
      <label>Dirección
        <input name="direccion" required minlength="5">
      </label>
      <label>Código postal
        <input name="cp" required pattern="[0-9]{5}" placeholder="06000">
      </label>
      <p id="errores" class="errores" role="alert"></p>
      <div class="acciones">
        <button type="button" id="cancelar-pedido" class="btn-secundario">Cancelar</button>
        <button type="submit" class="btn-principal">Confirmar pedido</button>
      </div>
    </form>
  </dialog>

  <div id="aviso" class="aviso" role="status"></div>

  <footer class="pie">
    Proyecto de Lenguajes de Marcas / Desarrollo de Interfaces · DAM
  </footer>

  <script src="js/productos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
